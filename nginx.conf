server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        client_max_body_size 20m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's bundled mime.types has no .mjs entry, so an ES-module asset would
    # be served as application/octet-stream and refused by the browser. Setting
    # default_type here (rather than a `types` block, which would *replace* the
    # inherited map instead of extending it) fixes just that gap.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
